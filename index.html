<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Guidance (EG) - Professional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --container-bg: rgba(15, 23, 42, 0.88);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-inner: rgba(15, 23, 42, 0.6);
            --text-color: #f8fafc;
            --title-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.08);
            --muted-text: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --container-bg: rgba(255, 255, 255, 0.9);
            --card-bg: rgba(248, 250, 252, 0.8);
            --card-inner: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --title-color: #020617;
            --border-color: rgba(0, 0, 0, 0.08);
            --muted-text: #64748b;
        }

        * { box-sizing: border-box; }

        body { 
            background-color: var(--bg-color); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            padding: 30px 16px; 
            margin: 0;
            min-height: 100vh;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--container-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--border-color); 
        }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }

        .kpi-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--title-color);
            margin-top: 4px;
        }

        .kpi-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Quick KPI Bar -->
    <div class="kpi-row">
        <div class="kpi-card">
            <div class="kpi-label">Compliance Rate</div>
            <div class="kpi-val" id="kpiCompliance">100%</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Discipline Score</div>
            <div class="kpi-val" id="kpiScore">0 PTS</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Logged Entries</div>
            <div class="kpi-val" id="kpiLogs">0</div>
        </div>
    </div>
</div>

</body>
</html>
