<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderWell Journal & Performance Platform</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --green: #22c55e;
            --red: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        h1, h2, h3 {
            color: var(--text-color);
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
        }

        .thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Gallery Wall */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .gallery-card {
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .gallery-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background-color: var(--border);
        }

        .gallery-img-container {
            position: relative;
            height: 150px;
            background-color: #1e293b;
        }

        .gallery-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
        }

        .gallery-info {
            padding: 12px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input, select, textarea {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
        }

        .win { color: var(--green); }
        .loss { color: var(--red); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TraderWell Platform</h1>
        <button class="btn" onclick="openNewTradeModal()">+ Log Trade</button>
    </header>

    <!-- Trade Journal Table -->
    <div class="card">
        <h2>Trade Journal</h2>
        <table>
            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Pair</th>
                    <th>Type</th>
                    <th>Entry Photo</th>
                    <th>Result Photo</th>
                    <th>PnL ($)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tradeTableBody">
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </div>

    <!-- Chart Evidence Gallery Wall -->
    <div class="card">
        <h2>Chart Evidence Gallery Wall</h2>
        <div class="gallery-grid" id="galleryWall">
            <!-- Dynamic Content -->
        </div>
    </div>
</div>

<!-- Modal: Post-Trade Follow-Up -->
<div class="modal" id="followupModal">
    <div class="modal-content">
        <h3>Post-Trade Follow-Up</h3>
        <div class="form-group">
            <label for="fuStatusSelect">Trade Status</label>
            <select id="fuStatusSelect">
                <option value="WIN">WIN</option>
                <option value="LOSS">LOSS</option>
                <option value="BE">BE (Break Even)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="fuPnLInput">PnL ($)</label>
            <input type="number" id="fuPnLInput" placeholder="e.g. 250 or -100">
        </div>
        <div class="form-group">
            <label for="fuFileInput">Result Photo (Chart Screenshot)</label>
            <input type="file" id="fuFileInput" accept="image/*">
        </div>
        <div class="form-group">
            <label for="fuNotesInput">Notes</label>
            <textarea id="fuNotesInput" rows="3" placeholder="Trade review notes..."></textarea>
        </div>
        <button class="btn" onclick="saveFollowup()">Complete & Unlock</button>
    </div>
</div>

<script>
    // Global Application State
    const state = {
        baseline: 10000,
        activePendingTicket: null,
        trades: [
            { ticket: "TK-1001", pair: "EURUSD", type: "BUY", profit: 150, status: "WIN" }
        ],
        captures: {
            "TK-1001": { img: "https://via.placeholder.com/300x150/1e293b/38bdf8?text=Entry+Chart" }
        },
        results: {
            "TK-1001": { img: "https://via.placeholder.com/300x150/1e293b/22c55e?text=Result+Chart", notes: "Hit TP cleanly" }
        }
    };

    function renderTable() {
        const tbody = document.getElementById('tradeTableBody');
        tbody.innerHTML = '';

        state.trades.forEach(trade => {
            const entryImg = state.captures[trade.ticket]?.img;
            const resultImg = state.results[trade.ticket]?.img;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${trade.ticket}</td>
                <td>${trade.pair}</td>
                <td>${trade.type}</td>
                <td>${entryImg ? `<img src="${entryImg}" class="thumb" alt="Entry">` : 'No photo'}</td>
                <td>${resultImg ? `<img src="${resultImg}" class="thumb" alt="Result">` : 'No photo'}</td>
                <td class="${trade.profit >= 0 ? 'win' : 'loss'}">$${trade.profit || 0}</td>
                <td>${trade.status}</td>
                <td>
                    <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="openFollowupModal('${trade.ticket}')">Close/Update</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderGalleryWall() {
        const gallery = document.getElementById('galleryWall');
        gallery.innerHTML = '';

        state.trades.forEach(trade => {
            const entryImg = state.captures[trade.ticket]?.img;
            const resultImg = state.results[trade.ticket]?.img;

            const card = document.createElement('div');
            card.className = 'gallery-card';
            card.innerHTML = `
                <div class="gallery-images">
                    <div class="gallery-img-container">
                        ${entryImg ? `<img src="${entryImg}">` : '<div style="padding:10px; color:#666;">No Entry Chart</div>'}
                        <span class="gallery-label">ENTRY</span>
                    </div>
                    <div class="gallery-img-container">
                        ${resultImg ? `<img src="${resultImg}">` : '<div style="padding:10px; color:#666;">Pending Photo</div>'}
                        <span class="gallery-label">RESULT</span>
                    </div>
                </div>
                <div class="gallery-info">
                    <strong>${trade.ticket} - ${trade.pair} (${trade.type})</strong>
                    <div class="${trade.profit >= 0 ? 'win' : 'loss'}">PnL: $${trade.profit || 0}</div>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">
                        ${state.results[trade.ticket]?.notes || 'No notes available.'}
                    </p>
                </div>
            `;
            gallery.appendChild(card);
        });
    }

    function openFollowupModal(ticket) {
        state.activePendingTicket = ticket;
        document.getElementById('followupModal').style.display = 'flex';
    }

    function closeFollowupModal() {
        document.getElementById('followupModal').style.display = 'none';
        document.getElementById('fuFileInput').value = '';
    }

    // FIXED: Correctly saves and links result image data
    function saveFollowup() {
        const ticket = state.activePendingTicket || (state.trades.length > 0 ? state.trades[state.trades.length - 1].ticket : null);
        if (!ticket) return;

        const trade = state.trades.find(t => t.ticket === ticket);

        if (trade) {
            const status = document.getElementById('fuStatusSelect').value;
            const pnl = parseFloat(document.getElementById('fuPnLInput').value) || 0;
            const notes = document.getElementById('fuNotesInput').value || 'Hit target';
            const file = document.getElementById('fuFileInput').files[0];

            trade.status = status;
            trade.profit = pnl;

            const finishSave = (imgUrl) => {
                // Stores uploaded result image or falls back to entry screenshot if unprovided
                state.results[ticket] = {
                    img: imgUrl || state.captures[ticket]?.img || null,
                    notes: notes
                };

                let running = state.baseline;
                state.trades.forEach(t => {
                    running += t.profit;
                    t.calculatedEquity = running;
                });

                closeFollowupModal();
                updateAllDisplays();
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => finishSave(e.target.result);
                reader.readAsDataURL(file);
            } else {
                finishSave(null);
            }
        } else {
            closeFollowupModal();
        }
    }

    function openNewTradeModal() {
        const nextId = "TK-" + (1001 + state.trades.length);
        const newTrade = {
            ticket: nextId,
            pair: "GBPUSD",
            type: "BUY",
            profit: 0,
            status: "PENDING"
        };
        state.trades.push(newTrade);
        state.captures[nextId] = { img: "https://via.placeholder.com/300x150/1e293b/38bdf8?text=Entry+Chart" };
        updateAllDisplays();
        openFollowupModal(nextId);
    }

    function updateAllDisplays() {
        renderTable();
        renderGalleryWall();
    }

    // Initial Render
    document.addEventListener("DOMContentLoaded", () => {
        updateAllDisplays();
    });
</script>

</body>
</html>
