<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderWell - Trading Journal & Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#131e32', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- AUTHENTICATION MODAL -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl relative">
            <div class="flex items-center gap-3 mb-6">
                <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl">
                    <i data-lucide="trending-up" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">TraderWell</h1>
            </div>

            <h2 id="authTitle" class="text-xl font-bold text-white mb-2">Sign In to Your Account</h2>
            <p id="authSubtitle" class="text-sm text-slate-400 mb-6">Access your personal trading journal and analytics.</p>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required placeholder="trader@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold transition">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                <span id="authToggleText">Don't have an account?</span>
                <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-emerald-400 hover:underline font-bold ml-1">Register</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="appInterface" class="hidden min-h-screen flex flex-col">
        <header class="border-b border-slate-800 bg-slate-850/50 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg">
                        <i data-lucide="line-chart" class="w-5 h-5"></i>
                    </div>
                    <span class="text-lg font-bold text-white">TraderWell</span>
                </div>
                
                <div class="flex items-center gap-4">
                    <span id="userDisplayEmail" class="text-xs text-slate-400 hidden sm:inline"></span>
                    <button onclick="handleLogout()" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-xs font-semibold text-slate-300 transition flex items-center gap-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="p-5 rounded-2xl bg-slate-850 border border-slate-800">
                    <div class="text-xs font-semibold text-slate-400 mb-1">Total PnL</div>
                    <div id="metricTotalPnL" class="text-2xl font-bold text-white">$0.00</div>
                </div>
                <div class="p-5 rounded-2xl bg-slate-850 border border-slate-800">
                    <div class="text-xs font-semibold text-slate-400 mb-1">Win Rate</div>
                    <div id="metricWinRate" class="text-2xl font-bold text-white">0%</div>
                </div>
                <div class="p-5 rounded-2xl bg-slate-850 border border-slate-800">
                    <div class="text-xs font-semibold text-slate-400 mb-1">Total Trades</div>
                    <div id="metricTotalTrades" class="text-2xl font-bold text-white">0</div>
                </div>
                <div class="p-5 rounded-2xl bg-slate-850 border border-slate-800">
                    <div class="text-xs font-semibold text-slate-400 mb-1">Profit Factor</div>
                    <div id="metricProfitFactor" class="text-2xl font-bold text-white">0.00</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 bg-slate-850 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4">Cumulative Performance</h3>
                    <div class="h-64 sm:h-80 w-full">
                        <canvas id="pnlChart"></canvas>
                    </div>
                </div>

                <div class="bg-slate-850 border border-slate-800 rounded-2xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4">Log New Trade</h3>
                    <form id="tradeForm" onsubmit="handleTradeSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Asset / Symbol</label>
                            <input type="text" id="tradeSymbol" required placeholder="e.g. EURUSD or AAPL" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Direction</label>
                                <select id="tradeDirection" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    <option value="Long">Long</option>
                                    <option value="Short">Short</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Net PnL ($)</label>
                                <input type="number" step="0.01" id="tradePnL" required placeholder="e.g. 150.00 or -50" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Trade Notes / Strategy</label>
                            <textarea id="tradeNotes" rows="3" placeholder="Setup details, emotional state..." class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                        </div>
                        <button type="submit" id="saveTradeBtn" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm transition">
                            Record Trade
                        </button>
                    </form>
                </div>
            </div>

            <div class="bg-slate-850 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="p-6 border-b border-slate-800">
                    <h3 class="text-sm font-semibold text-slate-300">Recent Trades</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 bg-slate-900/50">
                                <th class="p-4">Date</th>
                                <th class="p-4">Symbol</th>
                                <th class="p-4">Direction</th>
                                <th class="p-4">PnL</th>
                                <th class="p-4">Notes</th>
                            </tr>
                        </thead>
                        <tbody id="tradesTableBody" class="divide-y divide-slate-800 text-sm text-slate-300"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUser = null;
        let isRegistering = false;
        let chartInstance = null;

        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            const savedUser = localStorage.getItem('tw_active_user');
            if (savedUser) {
                currentUser = savedUser;
                showAppUI();
            } else {
                showAuthUI();
            }
        });

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('authTitle').innerText = isRegistering ? 'Create Your Account' : 'Sign In to Your Account';
            document.getElementById('authSubtitle').innerText = isRegistering ? 'Start tracking your trading performance today.' : 'Access your personal trading journal and analytics.';
            document.getElementById('authSubmitBtn').innerText = isRegistering ? 'Register' : 'Sign In';
            document.getElementById('authToggleText').innerText = isRegistering ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('authToggleBtn').innerText = isRegistering ? 'Sign In' : 'Register';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            const users = JSON.parse(localStorage.getItem('tw_users') || '{}');

            if (isRegistering) {
                if (users[email]) {
                    alert('An account with this email already exists.');
                    return;
                }
                users[email] = password;
                localStorage.setItem('tw_users', JSON.stringify(users));
                alert('Account created successfully! Logging you in...');
            } else {
                if (!users[email] || users[email] !== password) {
                    alert('Invalid email or password.');
                    return;
                }
            }

            currentUser = email;
            localStorage.setItem('tw_active_user', email);
            showAppUI();
        }

        function handleLogout() {
            localStorage.removeItem('tw_active_user');
            currentUser = null;
            showAuthUI();
        }

        function showAuthUI() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('appInterface').classList.add('hidden');
        }

        function showAppUI() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('appInterface').classList.remove('hidden');
            document.getElementById('userDisplayEmail').innerText = currentUser;
            loadTrades();
        }

        function getTradesKey() {
            return `tw_trades_${currentUser}`;
        }

        function loadTrades() {
            const trades = JSON.parse(localStorage.getItem(getTradesKey()) || '[]');
            renderDashboard(trades);
        }

        function handleTradeSubmit(e) {
            e.preventDefault();
            const symbol = document.getElementById('tradeSymbol').value;
            const direction = document.getElementById('tradeDirection').value;
            const pnl = parseFloat(document.getElementById('tradePnL').value);
            const notes = document.getElementById('tradeNotes').value;

            const newTrade = {
                id: Date.now(),
                symbol: symbol.toUpperCase(),
                direction,
                pnl,
                notes,
                created_at: new Date().toISOString()
            };

            const trades = JSON.parse(localStorage.getItem(getTradesKey()) || '[]');
            trades.unshift(newTrade);
            localStorage.setItem(getTradesKey(), JSON.stringify(trades));

            document.getElementById('tradeForm').reset();
            loadTrades();
        }

        function renderDashboard(trades) {
            const tableBody = document.getElementById('tradesTableBody');
            tableBody.innerHTML = '';

            if (trades.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No trades recorded yet. Log your first trade above!</td></tr>`;
                updateMetrics(0, 0, 0, 0);
                updateChart([], []);
                return;
            }

            let totalPnL = 0, winCount = 0, grossProfit = 0, grossLoss = 0;
            const cumulativePnL = [];
            const labels = [];

            const sortedTrades = [...trades].reverse();
            let runningPnL = 0;

            sortedTrades.forEach((trade, index) => {
                runningPnL += parseFloat(trade.pnl);
                cumulativePnL.push(runningPnL);
                labels.push(`Trade #${index + 1}`);
            });

            trades.forEach(trade => {
                const pnl = parseFloat(trade.pnl);
                totalPnL += pnl;

                if (pnl > 0) { winCount++; grossProfit += pnl; } 
                else if (pnl < 0) { grossLoss += Math.abs(pnl); }

                const pnlClass = pnl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                const dateStr = new Date(trade.created_at).toLocaleDateString();

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-800/40 transition';
                row.innerHTML = `
                    <td class="p-4 text-slate-400">${dateStr}</td>
                    <td class="p-4 font-bold text-white">${trade.symbol}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs font-semibold ${trade.direction === 'Long' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">${trade.direction}</span></td>
                    <td class="p-4 font-semibold ${pnlClass}">$${pnl.toFixed(2)}</td>
                    <td class="p-4 text-slate-400 text-xs">${trade.notes || '-'}</td>
                `;
                tableBody.appendChild(row);
            });

            const winRate = ((winCount / trades.length) * 100).toFixed(1);
            const profitFactor = grossLoss === 0 ? grossProfit.toFixed(2) : (grossProfit / grossLoss).toFixed(2);

            updateMetrics(totalPnL, winRate, trades.length, profitFactor);
            updateChart(labels, cumulativePnL);
        }

        function updateMetrics(pnl, winRate, count, pf) {
            const pnlElem = document.getElementById('metricTotalPnL');
            pnlElem.innerText = `$${pnl.toFixed(2)}`;
            pnlElem.className = `text-2xl font-bold ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            document.getElementById('metricWinRate').innerText = `${winRate}%`;
            document.getElementById('metricTotalTrades').innerText = count;
            document.getElementById('metricProfitFactor').innerText = pf;
        }

        function initChart() {
            const ctx = document.getElementById('pnlChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Cumulative PnL ($)',
                        data: [],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function updateChart(labels, data) {
            if (!chartInstance) return;
            chartInstance.data.labels = labels;
            chartInstance.data.datasets[0].data = data;
            chartInstance.update();
        }
    </script>
</body>
</html>
